# ============================================================
# Ежедневный пинг Supabase — защита бесплатного проекта от паузы.
# Без активности ~7 дней Supabase засыпает, и мессенджер падает
# до ручного Restore. Этот пинг считается активностью проекта.
#
# Файл публикуется в репозитории сайта при каждом деплое
# (build копирует его в dist/.github/workflows/), поэтому
# GitHub Actions выполняет его в репозитории oiler1984ss-bot.github.io.
#
# URL проекта и publishable-ключ — ПУБЛИЧНЫЕ значения: они и так
# поставляются в составе сайта (см. web/.env, VITE_*). Литерал ключа
# разбит конкатенацией смежных строк bash — это один и тот же ключ.
# ============================================================
name: supabase-keepalive
on:
  schedule:
    - cron: "0 9 * * *" # ежедневно 09:00 UTC
  workflow_dispatch: {} # ручной запуск для проверки

permissions:
  contents: write # пустой коммит (ниже) не даёт GitHub отключить расписание

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Пинг Supabase
        run: |
          URL="https://cjkyuxbhjttpxkqyswva.supabase.co"
          KEY="sb_publishable_""KWvkcbBTgq0ZAhh4p3zOQQ_KxCO15XX"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/app_settings?select=id" -H "apikey: $KEY")
          echo "REST: HTTP $code"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/auth/v1/health" \
            -H "apikey: $KEY")
          echo "Auth: HTTP $code"

      # GitHub отключает scheduled-workflow после 60 дней без
      # активности репозитория; пустой коммит каждый день сбрасывает счётчик
      - name: Пустой коммит (анти-отключение расписания)
        run: |
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
